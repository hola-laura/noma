const initGallery = () => {
  const deck = document.querySelector('.gallery');
  if (!deck || deck.dataset.ready) return;
  deck.dataset.ready = '1';
  const stage = deck.closest('.gallery-stage');
  const fit = () => stage.style.setProperty('--gallery-scale', stage.clientWidth / 528);
  fit();
  const cards = [...deck.querySelectorAll('.gallery-card')];
  deck.querySelectorAll('img').forEach((img) => {
    if (img.complete && !img.naturalWidth) img.remove(); else img.addEventListener('error', () => img.remove());
  });
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let order = [...cards].reverse(), drag = null, busy = false, paintFrame = 0, generation = 0;
  const animations = new Map();
  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
  const layout = () => order.forEach((card, i) => { card.dataset.slot = i; card.style.zIndex = i + 1; });
  const stop = (card) => { const a = animations.get(card); if (a) a.cancel(); animations.delete(card); };
  const position = (card, x, y, angle) => { card.style.translate = x + 'px ' + y + 'px'; card.style.rotate = angle + 'deg'; };
  const animate = async (card, frames, duration, easing = 'linear') => {
    stop(card);
    if (reduced.matches) return;
    const animation = card.animate(frames, { duration, easing, fill: 'forwards' });
    animations.set(card, animation);
    try { await animation.finished; } catch (e) {}
    if (animations.get(card) === animation) {
      const last = frames[frames.length - 1];
      card.style.translate = last.translate; card.style.rotate = last.rotate;
      animations.delete(card); animation.cancel();
    }
  };
  const spring = (card, x, y, angle = 0) => {
    if (reduced.matches) { position(card, 0, 0, 0); return Promise.resolve(); }
    const frames = [], frequency = 17, damping = 0.78, damped = frequency * Math.sqrt(1 - damping * damping);
    for (let i = 0; i <= 48; i++) {
      const t = i / 48 * 0.68;
      const remaining = Math.exp(-damping * frequency * t) * (Math.cos(damped * t) + damping * frequency / damped * Math.sin(damped * t));
      frames.push({ translate: (x * remaining) + 'px ' + (y * remaining) + 'px', rotate: (angle * remaining) + 'deg', offset: i / 48 });
    }
    frames[48] = { translate: '0px 0px', rotate: '0deg', offset: 1 };
    return animate(card, frames, 680);
  };
  const reorder = (card) => {
    const top = order[order.length - 1] === card;
    order = order.filter((item) => item !== card);
    if (top) order.unshift(card); else order.push(card);
    layout();
  };

    if (busy) return;
    busy = true;
    const token = ++generation;
    if (order[order.length - 1] === card && !reduced.matches) {
      card.style.zIndex = 5;
      const scale = deck.getBoundingClientRect().width / deck.offsetWidth;
      const direction = Math.abs(x) > 5 ? Math.sign(x) : -1;
      const outX = direction * Math.max(Math.abs(x) + 36, card.getBoundingClientRect().width / scale + 28);
      const outY = y - 18, outAngle = direction * 9;
      await animate(card, [{ translate: x + 'px ' + y + 'px', rotate: angle + 'deg' }, { translate: outX + 'px ' + outY + 'px', rotate: outAngle + 'deg' }], Math.abs(x) > 5 ? 140 : 220, 'cubic-bezier(.2,.65,.3,1)');
      if (token !== generation) return;
      reorder(card);
      busy = false;
      await spring(card, outX, outY, outAngle);
    } else {
      reorder(card);
      await spring(card, x, y, angle);
    }
    if (token === generation) busy = false;
  };
  const paint = () => { paintFrame = 0; if (drag && drag.moved) position(drag.card, drag.x, drag.y, drag.angle); };
  const release = (event, cancelled = false) => {
    if (!drag || (event && event.pointerId !== drag.id)) return;
    cancelAnimationFrame(paintFrame); paintFrame = 0;
    const active = drag;
    drag = null;
    active.card.classList.remove('is-dragging');
    if (active.card.hasPointerCapture(active.id)) active.card.releasePointerCapture(active.id);
    position(active.card, active.x, active.y, active.angle);
    if (!cancelled && (!active.moved || Math.abs(active.dx) > 52 || (active.type !== 'touch' && Math.abs(active.dy) > 65))) {
      shuffle(active.card, active.x, active.y, active.angle);
    } else { layout(); spring(active.card, active.x, active.y, active.angle); }
  };
  cards.forEach((card) => {
    card.addEventListener('dragstart', (e) => e.preventDefault());
    card.addEventListener('pointerdown', (e) => {
      if (!e.isPrimary || e.button !== 0 || drag || busy) return;
      const visual = getComputedStyle(card);
      const coordinates = visual.translate.split(/\s+/).map(parseFloat);
      const baseX = Number.isFinite(coordinates[0]) ? coordinates[0] : 0;
      const baseY = Number.isFinite(coordinates[1]) ? coordinates[1] : 0;
      const baseAngle = parseFloat(visual.rotate) || 0;
      stop(card);
      position(card, baseX, baseY, baseAngle);
      drag = { baseX, baseY, baseAngle, card, id: e.pointerId, startX: e.clientX, startY: e.clientY, x: baseX, y: baseY, dx: 0, dy: 0, angle: baseAngle, scale: deck.getBoundingClientRect().width / deck.offsetWidth, type: e.pointerType, moved: false };
      card.setPointerCapture(e.pointerId);
    });
    card.addEventListener('pointermove', (e) => {
      if (!drag || drag.id !== e.pointerId) return;
      const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
      if (drag.type === 'touch' && !drag.moved && Math.abs(dy) > 8 && Math.abs(dy) > Math.abs(dx)) { release(e, true); return; }
      if (!drag.moved && Math.hypot(dx, dy) < 4) return;
      drag.moved = true; drag.dx = dx; drag.dy = dy;
      const resist = (value, limit) => Math.abs(value) <= limit ? value : Math.sign(value) * (limit + (Math.abs(value) - limit) * 0.18);
      drag.x = drag.baseX + resist(dx, 210) / drag.scale;
      drag.y = drag.baseY + resist(dy, 140) / drag.scale;
      drag.angle = reduced.matches ? 0 : clamp(drag.baseAngle + dx * 0.035, -9, 9);
      card.classList.add('is-dragging');
      card.style.zIndex = 5;
      if (!paintFrame) paintFrame = requestAnimationFrame(paint);
    });
    card.addEventListener('pointerup', release);
    card.addEventListener('pointercancel', (e) => release(e, true));
    card.addEventListener('lostpointercapture', (e) => release(e, true));
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!drag) shuffle(card); }
      if (e.key === 'Escape') release(null, true);
    });
  });
  new ResizeObserver(() => { fit(); release(null, true); generation++; busy = false; cards.forEach((card) => { stop(card); position(card, 0, 0, 0); }); layout(); }).observe(stage);
  layout();
};

class Component extends DCLogic {
  state = { sector: null, chosen: 1 };
  componentDidMount() { initGallery(); }
  componentDidUpdate() { initGallery(); }
  renderVals() {
    const top = () => { try { window.scrollTo(0, 0); } catch (e) {} };
    const sectors = SECTORS.map((x) => ({ label: x.label, pick: () => { this.setState({ sector: x.id, chosen: 1 }); top(); } }));
    const s = SECTORS.find((x) => x.id === this.state.sector) || SECTORS[0];
    const base = THEMES[this.state.sector] || THEMES.otro;
    const t = this.state.sector && this.state.sector !== 'otro' ? base : { ...base, a: this.props.accent ?? base.a, h: this.props.accent ?? base.h };
    const chosen = s.opts[this.state.chosen];
    const optBase = 'min-height: 52px; padding: 6px 8px; border-radius: 14px; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; border: 2px solid; transition: background 0.15s; ';
    const opts = s.opts.map((text, i) => {
      const on = i === this.state.chosen;
      return { text, pressed: on ? 'true' : 'false',
        css: optBase + (on ? 'background: ' + t.a + '; border-color: ' + t.a + '; color: ' + t.on : 'background: #FFFFFF; border-color: ' + t.soft + '; color: ' + t.ink),
        pick: () => this.setState({ chosen: i }) };
    });
    const rowBase = 'display: flex; gap: 14px; padding: 12px 14px; border-radius: 12px; ';
    const agenda = s.agenda.map((r) => ({ t: r[0], w: r[1], css: rowBase + 'background: transparent' }))
      .concat([{ t: 'Nuevo', w: s.newRow, css: rowBase + 'background: ' + t.soft }]);
    const posts = s.posts.map((p) => {
      const veil = 'rgba(' + t.rgb + ', 0.52)';
      const photo = p[1] ? 'linear-gradient(' + veil + ', ' + veil + '), url(https://images.pexels.com/photos/' + p[1] + '/pexels-photo-' + p[1] + '.jpeg?auto=compress&cs=tinysrgb&w=500&h=500&fit=crop) center / cover, ' : '';
      return { text: p[0], css: 'aspect-ratio: 1; overflow: hidden; color: #FFFFFF; display: flex; align-items: flex-end; background: ' + photo + t.ink };
    });
    const last = s.flow.length - 1;
    const flow = s.flow.map((text, i) => ({ text,
      css: 'border-radius: 14px; padding: 18px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 2px 16px; ' + (i === last ? 'background: ' + t.a + '; color: ' + t.on : 'background: #FFFFFF') }));
    return { t, isIntro: !this.state.sector, isPage: !!this.state.sector, sectors, s, chosen, opts, agenda, posts, flow,
      reset: () => { this.setState({ sector: null, chosen: 1 }); top(); } };
  }
}

const TPL=document.getElementById('tpl').textContent;
const get=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const c=new Component(),root=document.getElementById('app'),acts=[];
const esc=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function holes(h,v){return h.replace(/onClick="\{\{\s*([\w.$]+)\s*\}\}"/g,(m,p)=>{acts.push(get(v,p));return 'data-act="'+(acts.length-1)+'"'}).replace(/\{\{\s*([\w.$]+)\s*\}\}/g,(m,p)=>{const x=get(v,p);return x==null?m:esc(x)})}
function draw(){const v=c.renderVals();acts.length=0;let h=TPL.replace(/<sc-if value="\{\{\s*(\w+)\s*\}\}"[^>]*>([\s\S]*?)<\/sc-if>/g,(m,n,b)=>v[n]?b:'');
h=h.replace(/<sc-for list="\{\{\s*(\w+)\s*\}\}" as="(\w+)"[^>]*>([\s\S]*?)<\/sc-for>/g,(m,l,as,b)=>v[l].map(it=>holes(b,{...v,[as]:it})).join(''));
root.innerHTML=holes(h,v);if(c.componentDidUpdate)c.componentDidUpdate()}
root.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)acts[+b.dataset.act]()});
draw();
</script>
